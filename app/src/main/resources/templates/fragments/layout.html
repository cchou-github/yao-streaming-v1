<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Shared fragments</title>
</head>
<body>

<!-- Shared page chrome, included by each page via th:replace. -->
<th:block th:fragment="pageHead">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --ground: #f7f8fa;
            --surface: #ffffff;
            --ink: #171b22;
            --ink-muted: #5a6472;
            --rule: #d9dee6;
            --accent: #2f6690;
            --ready: #3f7a56;
            --pending: #8a6d3b;
            --failed: #a8503c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--ground);
            color: var(--ink);
            line-height: 1.55;
        }
        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            padding: .75rem 1.25rem;
            background: var(--surface);
            border-bottom: 1px solid var(--rule);
            font-size: .9rem;
        }
        .bar nav { display: flex; gap: 1rem; align-items: center; }
        .bar a { color: var(--accent); text-decoration: none; }
        .bar a:hover { text-decoration: underline; }
        .bar .who { color: var(--ink-muted); }
        .bar form { margin: 0; }
        .bar button {
            padding: .35rem .7rem;
            cursor: pointer;
            border: 1px solid var(--rule);
            background: var(--ground);
            border-radius: .3rem;
            font: inherit;
        }
        main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
        h1 { font-size: 1.6rem; letter-spacing: -.02em; margin: 0 0 .35rem; }
        .muted { color: var(--ink-muted); }
        .badge {
            display: inline-block;
            font-size: .72rem;
            font-weight: 600;
            letter-spacing: .02em;
            padding: .12rem .5rem;
            border-radius: 1rem;
            border: 1px solid currentColor;
        }
        .badge.READY, .badge.LIVE { color: var(--ready); }
        .badge.PROCESSING, .badge.UPLOADING,
        .badge.PENDING, .badge.STARTING, .badge.ENDING { color: var(--pending); }
        .badge.FAILED { color: var(--failed); }
        .badge.ENDED { color: var(--ink-muted); }
        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
    </style>
</th:block>

<th:block th:fragment="nav">
    <div class="bar">
        <nav>
            <a th:href="@{/}">Catalogue</a>
            <a th:href="@{/upload}">Upload</a>
            <a th:href="@{/streams}">Live</a>
            <a th:href="@{/streams/golive}">Go live</a>
        </nav>
        <nav>
            <span class="who">Signed in as <strong sec:authentication="name">user</strong></span>
            <form method="post" th:action="@{/logout}">
                <button type="submit">Sign out</button>
            </form>
        </nav>
    </div>
</th:block>

</body>
</html>
