spring.application.name=streaming-api

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:streaming}
spring.datasource.username=${DB_USER:streaming}
spring.datasource.password=${DB_PASSWORD:streaming}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Sessions live in MySQL (see SessionConfig, V5__create_spring_session_tables.sql)
# instead of each pod's own memory. The session filter must run before Spring
# Security's filter chain (order -100), or Security reads/writes the servlet
# container's own default session instead of the JDBC-backed one — set this
# explicitly rather than relying on default ordering between the two.
spring.session.servlet.filter-order=-2147483648

app.storage.endpoint=${AWS_ENDPOINT_URL:}
app.storage.public-endpoint=${AWS_PUBLIC_ENDPOINT_URL:}
app.storage.region=${AWS_REGION:us-east-1}
app.storage.raw-bucket=${RAW_BUCKET:yao-streaming-raw}
app.storage.processed-bucket=${PROCESSED_BUCKET:yao-streaming-processed}
app.storage.upload-url-ttl=15m
# Kept well under an hour - against real AWS this is signed with IRSA's
# temporary STS credentials, and a presigned URL cannot outlive the
# credentials that signed it.
app.storage.playback-url-ttl=45m

# false everywhere except real AWS - LocalStack has no CloudFront
# equivalent, and the processed bucket is already public there, so this
# stays fully inert locally. See CloudFrontCookieSigner's javadoc.
app.cloudfront.enabled=${CLOUDFRONT_ENABLED:false}
app.cloudfront.domain-name=${CLOUDFRONT_DOMAIN_NAME:}
app.cloudfront.key-pair-id=${CLOUDFRONT_KEY_PAIR_ID:}
app.cloudfront.private-key-pem=${CLOUDFRONT_PRIVATE_KEY:}
app.cloudfront.cookie-ttl=45m

app.live.enabled=${LIVE_ENABLED:false}
app.live.pool-channel-ids=${LIVE_POOL_CHANNEL_IDS:}
app.live.pool-ingest-urls=${LIVE_POOL_INGEST_URLS:}
app.live.pool-origin-slugs=${LIVE_POOL_ORIGIN_SLUGS:}

app.transcode.poll-interval=5s
app.transcode.timeout=10m
app.transcode.segment-seconds=4
# false against real AWS (k8s/aws/app.yaml) - see UploadWatcher's javadoc for
# why it can't just stay on: it wins the race against the real S3/Lambda/
# MediaConvert pipeline every time and fails every video before MediaConvert
# ever finishes.
app.transcode.watcher-enabled=${TRANSCODE_WATCHER_ENABLED:true}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
